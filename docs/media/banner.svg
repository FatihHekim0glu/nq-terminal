<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">nq-terminal</title>
  <desc id="banner-desc">The word nq-terminal typed into the terminal's command line in amber, under a tab strip carrying the READ ONLY and NO ORDER PATH flags and a row of function keys, beside a numbered mnemonic list, above a status line. Tagline: keyboard-first, read-only terminal for NautilusTrader NQ-futures research.</desc>
  <defs>
    <clipPath id="clip-frame">
      <rect width="1280" height="320" rx="12" ry="12"/>
    </clipPath>
    <style>
      .mono { font-family: 'PT Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
      .sans { font-family: 'Source Sans 3', 'Source Sans Pro', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .b { font-weight: 700; }
    </style>
  </defs>

  <g clip-path="url(#clip-frame)">
    <!-- Ground: flat black, as the terminal (tokens.css token bg #000000) -->
    <rect width="1280" height="320" fill="#000000"/>

    <!-- Frame strip (token frame-bg #CDCDCD), active tab (token frame-tab-on #191919) -->
    <rect x="0" y="0" width="1280" height="30" fill="#CDCDCD"/>
    <rect x="0" y="0" width="200" height="30" fill="#191919"/>
    <text x="16" y="20" class="sans b" font-size="12" fill="#FFFFFF">HOME</text>
    <text x="60" y="20" class="sans" font-size="12" fill="#D9DAD9">Home view</text>
    <text x="226" y="20" class="sans" font-size="12" fill="#000000">RESEARCH</text>
    <text x="312" y="20" class="sans" font-size="12" fill="#000000">LIVE</text>
    <text x="360" y="20" class="sans" font-size="13" fill="#000000">+</text>

    <!-- Safety flags (token flag-bg #870F1E, token flag-fg #FFFFFF) -->
    <rect x="1068" y="4" width="84" height="22" fill="#870F1E"/>
    <text x="1110" y="19.5" class="sans b" font-size="11" fill="#FFFFFF" text-anchor="middle">READ ONLY</text>
    <rect x="1158" y="4" width="110" height="22" fill="#870F1E"/>
    <text x="1213" y="19.5" class="sans b" font-size="11" fill="#FFFFFF" text-anchor="middle">NO ORDER PATH</text>

    <!-- Function keys (token key-cancel #FF425A, token key-go #18BD39, token key-fg #000000) -->
    <g class="sans" font-size="10" text-anchor="middle" fill="#000000">
      <rect x="32" y="37" width="50" height="24" fill="#FF425A"/><text x="57" y="53">CANCEL</text>
      <rect x="86" y="37" width="50" height="24" fill="#18BD39"/><text x="111" y="53">HELP</text>
      <rect x="140" y="37" width="50" height="24" fill="#18BD39"/><text x="165" y="53">SEARCH</text>
      <rect x="194" y="37" width="50" height="24" fill="#18BD39"/><text x="219" y="53">MENU</text>
      <rect x="248" y="37" width="50" height="24" fill="#18BD39"/><text x="273" y="53">PG BACK</text>
      <rect x="302" y="37" width="50" height="24" fill="#18BD39"/><text x="327" y="53">PG FWD</text>
      <rect x="356" y="37" width="50" height="24" fill="#18BD39"/><text x="381" y="53">HOME</text>
      <rect x="410" y="37" width="50" height="24" fill="#18BD39"/><text x="435" y="53">REG</text>
      <rect x="464" y="37" width="50" height="24" fill="#18BD39"/><text x="489" y="53">RUNS</text>
      <rect x="518" y="37" width="50" height="24" fill="#18BD39"/><text x="543" y="53">LEDG</text>
      <rect x="572" y="37" width="50" height="24" fill="#18BD39"/><text x="597" y="53">LIVE</text>
      <rect x="626" y="37" width="50" height="24" fill="#18BD39"/><text x="651" y="53">OOS</text>
    </g>

    <!-- Command line (token cmd-border #148EFF, token cmd-caret #2B8EFF) with the wordmark typed in amber (token data #FFA028) -->
    <rect x="33" y="85" width="706" height="118" fill="#000000" stroke="#148EFF" stroke-width="2"/>
    <rect x="50" y="108" width="12" height="70" fill="#2B8EFF"/>
    <text x="80" y="168" class="mono b" font-size="84" fill="#FFA028" textLength="560" lengthAdjust="spacingAndGlyphs">nq-terminal</text>
    <rect x="652" y="104" width="46" height="80" fill="#FFA028">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="4" fill="remove"/>
    </rect>

    <!-- A numbered panel, as HELP draws it: title strip, function bar (token fn-bar #870F1E), numbered rows -->
    <rect x="764" y="84" width="484" height="18" fill="#CDCDCD"/>
    <text x="772" y="97" class="sans" font-size="11" fill="#000000">1-HELP</text>
    <text x="1240" y="97" class="sans" font-size="11" fill="#000000" text-anchor="end">&#8801; Options</text>
    <rect x="764" y="102" width="484" height="22" fill="#870F1E"/>
    <rect x="764" y="102" width="132" height="22" fill="#FFA028"/>
    <text x="770" y="118" class="sans" font-size="13" fill="#000000">&lt;Search help&gt;</text>
    <text x="1240" y="118" class="sans b" font-size="13" fill="#FFFFFF" text-anchor="end">Help</text>
    <g class="sans" font-size="14">
      <text x="800" y="142" fill="#A5A5A5" text-anchor="end" font-size="12">1)</text>
      <text x="810" y="142" fill="#D7D7D7">HOME</text>
      <text x="884" y="142" fill="#FFA028">Home view</text>
      <text x="800" y="162" fill="#A5A5A5" text-anchor="end" font-size="12">5)</text>
      <text x="810" y="162" fill="#D7D7D7">REG</text>
      <text x="884" y="162" fill="#FFA028">Registry board</text>
      <text x="800" y="182" fill="#A5A5A5" text-anchor="end" font-size="12">11)</text>
      <text x="810" y="182" fill="#D7D7D7">RET</text>
      <text x="884" y="182" fill="#FFA028">Analytics: returns and risk</text>
      <text x="800" y="202" fill="#A5A5A5" text-anchor="end" font-size="12">17)</text>
      <text x="810" y="202" fill="#D7D7D7">OOS</text>
      <text x="884" y="202" fill="#FFA028">Gate access log and openings</text>
    </g>

    <!-- Tagline (token text #D7D7D7) and what it shows (token muted #A5A5A5) -->
    <text x="32" y="246" class="sans" font-size="26" fill="#D7D7D7">Keyboard-first, read-only terminal for NautilusTrader NQ-futures research</text>
    <text x="32" y="274" class="sans" font-size="15" fill="#A5A5A5">Pre-registered hypotheses  &#183;  backtest runs and their analytics  &#183;  the out-of-sample audit trail  &#183;  the paper book's journals</text>

    <!-- Status line (token chrome #191919, token chrome-div #646464) -->
    <rect x="0" y="292" width="1280" height="28" fill="#191919"/>
    <g class="sans" font-size="12" fill="#D7D7D7">
      <text x="12" y="310" fill="#FFA028">Status</text>
      <rect x="64" y="292" width="1" height="28" fill="#646464"/>
      <text x="74" y="310"><tspan class="b" fill="#FFFFFF">Screen</tspan> HOME</text>
      <rect x="166" y="292" width="1" height="28" fill="#646464"/>
      <text x="176" y="310"><tspan class="b" fill="#FFFFFF">A</tspan> NQ1 Index</text>
      <rect x="270" y="292" width="1" height="28" fill="#646464"/>
      <text x="280" y="310"><tspan class="b" fill="#FFFFFF">B</tspan> volmanaged_v0</text>
      <rect x="404" y="292" width="1" height="28" fill="#646464"/>
      <text x="414" y="310"><tspan class="b" fill="#FFFFFF">C</tspan> -</text>
      <rect x="446" y="292" width="1" height="28" fill="#646464"/>
      <text x="456" y="310"><tspan class="b" fill="#FFFFFF">DATA</tspan> 2010-01-01..2021-12-31</text>
      <rect x="662" y="292" width="92" height="28" fill="#870F1E"/>
      <text x="708" y="310" class="b" fill="#FFFFFF" text-anchor="middle">READ ONLY</text>
      <rect x="756" y="292" width="120" height="28" fill="#870F1E"/>
      <text x="816" y="310" class="b" fill="#FFFFFF" text-anchor="middle">NO ORDER PATH</text>
      <text x="1266" y="310" text-anchor="end"><tspan fill="#FF425A">&lt;Esc&gt;</tspan> command</text>
    </g>
  </g>

  <!-- 1px edge so the black frame reads on both GitHub themes -->
  <rect x="0.5" y="0.5" width="1279" height="319" rx="11.5" ry="11.5" fill="none" stroke="#3D444D" stroke-width="1"/>
</svg>
