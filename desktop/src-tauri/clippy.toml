  { path = "std::fs::rename", reason = "writes go through src/writes.rs" },
  { path = "std::fs::remove_file", reason = "writes go through src/writes.rs" },
  { path = "std::fs::remove_dir", reason = "writes go through src/writes.rs" },
  { path = "std::fs::remove_dir_all", reason = "writes go through src/writes.rs" },
