# The shell has no data path (03 section 6 item 2). These bans hold everywhere in the crate; the only allow sites
# are the function-level allows in src/link.rs (TCP: get), src/reads.rs (reads: read_capped, read_lock,
# read_log_tail), src/writes.rs (writes: make_parents, open, move_file), src/window_folders.rs (ensure_data_dir:
# the WebView2 data folder, created with its protected DACL before the write module is configured),
# src/supervise.rs (the one CreateProcessW), src/smoke_screen2.rs (the smoke-only screen 2 placement) and the
# release-only show() sites in src/window.rs. Test modules and build.rs carry their own allow with a reason, because they are not part of the
# shipped shell. An allow lifts the whole lint on its function, so desktop/scripts/plant-check.ps1 holds the rest
# there by scope scan (no process, no show(), no native dialog; no fs in link.rs) and proves each ban fails a
# planted use, inside the three modules too.

disallowed-types = [
  { path = "std::net::TcpStream", reason = "only src/link.rs may open a TCP connection, to 127.0.0.1 only" },
  { path = "std::net::TcpListener", reason = "the shell never listens on a port" },
  { path = "std::net::UdpSocket", reason = "the shell has no network path" },
]

disallowed-methods = [
  { path = "std::net::TcpStream::connect", reason = "only src/link.rs may open a TCP connection" },
  { path = "std::net::TcpStream::connect_timeout", reason = "only src/link.rs may open a TCP connection" },
  { path = "std::fs::read", reason = "reads go through src/reads.rs" },
  { path = "std::fs::read_to_string", reason = "reads go through src/reads.rs" },
  { path = "std::fs::read_dir", reason = "reads go through src/reads.rs" },
  { path = "std::fs::read_link", reason = "reads go through src/reads.rs" },
  { path = "std::fs::File::open", reason = "file access goes through src/reads.rs or src/writes.rs" },
